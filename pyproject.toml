[tool.black]
line-length = 100
target-version = ["py310"]
exclude = '''
/(
  \.venv
| venv
| build
| dist
| \.git
| __pycache__
)/
'''

[tool.pylint.main]
recursive = true
ignore-paths = [
  ".*/miniconda3/.*",
  ".*/\\.conda/.*",
  ".*/\\.venv/.*",
  ".*/venv/.*",
  ".*/__pycache__/.*",
  ".*/build/.*",
  ".*/dist/.*",
]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
  "C0114", # missing-module-docstring
  "C0115", # missing-class-docstring
  "C0116", # missing-function-docstring
  "R0903", # too-few-public-methods
]
